<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Crypto Scanner (React)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #475569; 
            border-radius: 20px;
        }
    </style>
</head>
<body class="min-h-screen p-6">
    <div id="root" class="max-w-7xl mx-auto"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons Component Wrapper ---
        const Icon = ({ name, className }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        // --- Header Component ---
        const Header = ({ onRefresh, loading }) => (
            <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                        Crypto Technical Scanner
                    </h1>
                    <p class="text-slate-400 mt-1">Real-time analysis with 17+ indicators & Fundamental Insights</p>
                </div>
                <div class="flex items-center gap-3">
                    <button 
                        onClick={onRefresh} 
                        disabled={loading}
                        class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-all shadow-lg shadow-blue-500/20 disabled:opacity-50"
                    >
                        <Icon name="refresh-cw" className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`} />
                        {loading ? 'Scanning...' : 'Refresh Scanner'}
                    </button>
                </div>
            </header>
        );

        // --- Coin Selector Component ---
        const CoinSelector = ({ data, onSelect }) => {
             const [selectedCoin, setSelectedCoin] = useState("");

             const handleSelect = (e) => {
                 const symbol = e.target.value;
                 setSelectedCoin(symbol);
                 if (symbol) {
                     const coinData = data.find(d => d.symbol === symbol);
                     if(coinData) onSelect(coinData);
                 }
             };

             return (
                 <div class="mb-8 glass p-4 rounded-xl flex items-center gap-4">
                     <label class="text-slate-300 font-semibold whitespace-nowrap">Quick Analysis:</label>
                     <div class="relative w-full max-w-xs">
                         <select 
                            value={selectedCoin}
                            onChange={handleSelect}
                            class="w-full bg-slate-800 text-white border border-slate-700 rounded-lg px-4 py-2 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500"
                         >
                            <option value="">Select a coin...</option>
                            {data.map(coin => (
                                <option key={coin.symbol} value={coin.symbol}>
                                    {coin.symbol} - {coin.final_signal}
                                </option>
                            ))}
                         </select>
                         <div class="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none text-slate-400">
                             <Icon name="chevron-down" className="w-4 h-4" />
                         </div>
                     </div>
                     <span class="text-xs text-slate-500 italic hidden sm:block">
                        Select a coin to immediately view detailed analysis
                     </span>
                 </div>
             );
        };

        // --- Stats Component ---
        const Stats = ({ data }) => {
            const stats = useMemo(() => {
                const total = data.length;
                const buys = data.filter(i => i.final_signal.includes('BUY')).length;
                const sells = data.filter(i => i.final_signal.includes('SELL')).length;
                let sentiment = "Neutral";
                if (buys > sells * 1.5) sentiment = "Bullish";
                if (sells > buys * 1.5) sentiment = "Bearish";
                return { total, buys, sells, sentiment };
            }, [data]);

            const sentimentColor = 
                stats.sentiment === 'Bullish' ? 'text-green-400' : 
                stats.sentiment === 'Bearish' ? 'text-red-400' : 'text-blue-400';

            return (
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                    <div class="glass p-4 rounded-xl">
                        <h3 class="text-slate-400 text-sm">Total Assets</h3>
                        <p class="text-2xl font-bold text-white">{stats.total}</p>
                    </div>
                    <div class="glass p-4 rounded-xl">
                        <h3 class="text-slate-400 text-sm">Strong Buy Signals</h3>
                        <p class="text-2xl font-bold text-green-400">{stats.buys}</p>
                    </div>
                    <div class="glass p-4 rounded-xl">
                        <h3 class="text-slate-400 text-sm">Strong Sell Signals</h3>
                        <p class="text-2xl font-bold text-red-400">{stats.sells}</p>
                    </div>
                    <div class="glass p-4 rounded-xl">
                        <h3 class="text-slate-400 text-sm">Market Sentiment</h3>
                        <p class={`text-2xl font-bold ${sentimentColor}`}>{stats.sentiment}</p>
                    </div>
                </div>
            );
        };

        // --- Table Row Component ---
        const TableRow = ({ item, openModal }) => {
            const getSignalColor = (signal) => {
                if (signal.includes('STRONG BUY')) return 'text-green-400 font-bold';
                if (signal.includes('BUY')) return 'text-green-300';
                if (signal.includes('STRONG SELL')) return 'text-red-400 font-bold';
                if (signal.includes('SELL')) return 'text-red-300';
                return 'text-slate-400';
            };

            const getScoreColor = (score) => {
                if (score > 1) return 'bg-green-500/20 text-green-400';
                if (score > 0) return 'bg-green-500/10 text-green-300';
                if (score < -1) return 'bg-red-500/20 text-red-400';
                if (score < 0) return 'bg-red-500/10 text-red-300';
                return 'bg-slate-500/10 text-slate-400';
            };

            return (
                <tr class="hover:bg-slate-800/30 transition-colors border-b border-slate-700/50 cursor-pointer" onClick={() => openModal(item)}>
                    <td class="p-4 font-bold text-white">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-xs text-white">
                                {item.symbol.split('/')[0].substring(0,1)}
                            </div>
                            {item.symbol}
                        </div>
                    </td>
                    <td class="p-4 text-slate-300">${item.price.toFixed(4)}</td>
                    <td class={`p-4 ${getSignalColor(item.final_signal)}`}>{item.final_signal}</td>
                    <td class="p-4">
                        <span class={`px-2 py-1 rounded text-sm ${getScoreColor(item.sentiment_score)}`}>
                            {item.sentiment_score}
                        </span>
                    </td>
                    <td class="p-4">
                        <div class="flex items-center gap-2">
                            <div class="w-16 h-1.5 bg-slate-700 rounded-full overflow-hidden">
                                <div 
                                    class={`h-full ${item.rsi > 70 ? 'bg-red-500' : item.rsi < 30 ? 'bg-green-500' : 'bg-blue-500'}`} 
                                    style={{width: `${item.rsi}%`}}
                                ></div>
                            </div>
                            <span class="text-xs text-slate-400">{item.rsi.toFixed(1)}</span>
                        </div>
                    </td>
                    <td class="p-4 text-sm text-slate-400">{item.adx_strength}</td>
                    <td class="p-4">
                        {item.signals.slice(0, 2).map((s, idx) => (
                            <span key={idx} class="inline-block px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-300 mr-1 mb-1">
                                {s}
                            </span>
                        ))}
                        {item.signals.length > 2 && (
                            <span class="text-xs text-slate-500">+{item.signals.length - 2} more</span>
                        )}
                    </td>
                    <td class="p-4">
                        <button 
                            onClick={(e) => { e.stopPropagation(); openModal(item); }}
                            class="p-2 hover:bg-slate-700 rounded-lg transition-colors text-blue-400"
                        >
                            <Icon name="bar-chart-2" className="w-5 h-5" />
                        </button>
                    </td>
                </tr>
            );
        };

        // --- Modal Component ---
        const Modal = ({ item, onClose }) => {
            if (!item) return null;

            const fundamental = item.fundamental || {};
            const orderbook = item.orderbook || {};
            const news = item.news || [];
            const ranges = item.indicator_ranges || {};

            return (
                <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div class="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto custom-scrollbar" onClick={e => e.stopPropagation()}>
                        <div class="p-6 border-b border-slate-700 flex justify-between items-center sticky top-0 bg-slate-900 z-10">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-lg font-bold text-white">
                                    {item.symbol.split('/')[0].substring(0,1)}
                                </div>
                                <div>
                                    <h2 class="text-xl font-bold text-white">{item.symbol} Analysis</h2>
                                    <span class="text-xs text-slate-400">Technical & Fundamental Breakdown</span>
                                </div>
                            </div>
                            <button onClick={onClose} class="text-slate-400 hover:text-white transition-colors">
                                <Icon name="x" className="w-6 h-6" />
                            </button>
                        </div>
                        
                        <div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                            
                            {/* Left Column: Technical Signals */}
                            <div class="lg:col-span-1 space-y-6">
                                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                    <h3 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">Signal Strength</h3>
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-slate-400">Recommendation</span>
                                        <span class={`text-lg font-bold ${item.final_signal.includes('BUY') ? 'text-green-400' : item.final_signal.includes('SELL') ? 'text-red-400' : 'text-slate-300'}`}>
                                            {item.final_signal}
                                        </span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-slate-400">Sentiment Score</span>
                                        <span class="font-mono text-white text-lg">{item.sentiment_score}</span>
                                    </div>
                                </div>

                                <div class="bg-slate-800/30 p-4 rounded-xl border border-slate-700/50">
                                    <h3 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">Active Signals</h3>
                                    <div class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-1">
                                        {item.signals.map((s, idx) => (
                                            <div key={idx} class="flex items-start gap-2 text-sm text-slate-300">
                                                <Icon 
                                                    name={s.includes('Buy') || s.includes('Bullish') ? 'trending-up' : 'trending-down'} 
                                                    className={`w-4 h-4 mt-0.5 flex-shrink-0 ${s.includes('Buy') || s.includes('Bullish') ? 'text-green-400' : 'text-red-400'}`}
                                                />
                                                <span>{s}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Middle Column: Detailed Indicators */}
                            <div class="lg:col-span-2 space-y-6">
                                {/* Fundamental Data Section */}
                                <div class="bg-slate-800/30 p-5 rounded-xl border border-slate-700/50">
                                    <h3 class="flex items-center gap-2 text-lg font-semibold text-white mb-4">
                                        <Icon name="activity" className="w-5 h-5 text-purple-400" />
                                        Fundamental Overview
                                    </h3>
                                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700/50">
                                            <div class="text-xs text-slate-500 mb-1">Rank</div>
                                            <div class="text-white font-mono">#{fundamental.market_cap_rank || 'N/A'}</div>
                                        </div>
                                        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700/50">
                                            <div class="text-xs text-slate-500 mb-1">Sector</div>
                                            <div class="text-white font-medium">{fundamental.sector || 'Crypto'}</div>
                                        </div>
                                        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700/50">
                                            <div class="text-xs text-slate-500 mb-1">Dominance</div>
                                            <div class="text-white font-medium">{fundamental.market_dominance || 'N/A'}</div>
                                        </div>
                                        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700/50">
                                            <div class="text-xs text-slate-500 mb-1">Security</div>
                                            <div class={`font-bold ${fundamental.security_score === 'A+' ? 'text-green-400' : 'text-yellow-400'}`}>
                                                {fundamental.security_score || 'B'}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Indicator Ranges & Zones */}
                                {Object.keys(ranges).length > 0 && (
                                    <div class="bg-slate-800/30 p-5 rounded-xl border border-slate-700/50">
                                        <h3 class="flex items-center gap-2 text-lg font-semibold text-white mb-4">
                                            <Icon name="gauge" className="w-5 h-5 text-yellow-400" />
                                            Indicator Ranges & Buy/Sell Zones
                                        </h3>
                                        <div class="space-y-4 max-h-64 overflow-y-auto custom-scrollbar pr-2">
                                            {Object.entries(ranges).map(([indicator, data], idx) => (
                                                <div key={idx} class="bg-slate-800 p-3 rounded-lg border border-slate-700/30">
                                                    <div class="flex justify-between items-center mb-2">
                                                        <span class="font-semibold text-white">{indicator}</span>
                                                        <span class="text-sm text-slate-400">Value: {data.value}</span>
                                                    </div>
                                                    {data.zones && (
                                                        <div class="space-y-1">
                                                            {Object.entries(data.zones).map(([zone, zoneData]) => (
                                                                <div key={zone} class={`text-xs p-1 rounded ${data.current_zone === zone ? 'bg-blue-500/20 border border-blue-500/50' : 'bg-slate-700/30'}`}>
                                                                    <span class="text-slate-300">{zone}:</span> {zoneData.min} - {zoneData.max} 
                                                                    <span class={`ml-2 font-semibold ${zoneData.signal === 'BUY' ? 'text-green-400' : zoneData.signal === 'SELL' ? 'text-red-400' : 'text-slate-400'}`}>
                                                                        ({zoneData.signal})
                                                                    </span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                    {data.signal && (
                                                        <div class={`text-xs mt-2 p-2 rounded ${data.signal === 'BULLISH' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`}>
                                                            Signal: {data.signal} {data.strength && `(${data.strength})`}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Order Book & Order Movements */}
                                {orderbook.best_bid && (
                                    <div class="bg-slate-800/30 p-5 rounded-xl border border-slate-700/50">
                                        <h3 class="flex items-center gap-2 text-lg font-semibold text-white mb-4">
                                            <Icon name="layers" className="w-5 h-5 text-green-400" />
                                            Order Book & Market Depth
                                        </h3>
                                        <div class="grid grid-cols-2 gap-4">
                                            <div class="bg-slate-800 p-3 rounded-lg">
                                                <div class="text-xs text-slate-500 mb-1">Best Bid</div>
                                                <div class="text-green-400 font-mono text-lg">{orderbook.best_bid}</div>
                                            </div>
                                            <div class="bg-slate-800 p-3 rounded-lg">
                                                <div class="text-xs text-slate-500 mb-1">Best Ask</div>
                                                <div class="text-red-400 font-mono text-lg">{orderbook.best_ask}</div>
                                            </div>
                                            <div class="bg-slate-800 p-3 rounded-lg">
                                                <div class="text-xs text-slate-500 mb-1">Spread</div>
                                                <div class="text-white font-mono">{orderbook.spread_percentage}%</div>
                                            </div>
                                            <div class={`bg-slate-800 p-3 rounded-lg ${orderbook.order_movement === 'Buy Pressure' ? 'border border-green-500/50' : orderbook.order_movement === 'Sell Pressure' ? 'border border-red-500/50' : ''}`}>
                                                <div class="text-xs text-slate-500 mb-1">Order Movement</div>
                                                <div class={`font-semibold ${orderbook.order_movement === 'Buy Pressure' ? 'text-green-400' : orderbook.order_movement === 'Sell Pressure' ? 'text-red-400' : 'text-slate-400'}`}>
                                                    {orderbook.order_movement}
                                                </div>
                                            </div>
                                            <div class="bg-slate-800 p-3 rounded-lg">
                                                <div class="text-xs text-slate-500 mb-1">Bid Volume</div>
                                                <div class="text-green-300 font-mono">{orderbook.total_bid_volume}</div>
                                            </div>
                                            <div class="bg-slate-800 p-3 rounded-lg">
                                                <div class="text-xs text-slate-500 mb-1">Ask Volume</div>
                                                <div class="text-red-300 font-mono">{orderbook.total_ask_volume}</div>
                                            </div>
                                            <div class="bg-slate-800 p-3 rounded-lg col-span-2">
                                                <div class="text-xs text-slate-500 mb-1">Order Imbalance</div>
                                                <div class={`font-semibold ${orderbook.order_imbalance > 0 ? 'text-green-400' : orderbook.order_imbalance < 0 ? 'text-red-400' : 'text-slate-400'}`}>
                                                    {orderbook.order_imbalance > 0 ? '+' : ''}{orderbook.order_imbalance}%
                                                    {orderbook.order_imbalance > 5 && ' (Strong Buy Pressure)'}
                                                    {orderbook.order_imbalance < -5 && ' (Strong Sell Pressure)'}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* News Section */}
                                {news.length > 0 && (
                                    <div class="bg-slate-800/30 p-5 rounded-xl border border-slate-700/50">
                                        <h3 class="flex items-center gap-2 text-lg font-semibold text-white mb-4">
                                            <Icon name="newspaper" className="w-5 h-5 text-purple-400" />
                                            Latest News
                                        </h3>
                                        <div class="space-y-3 max-h-64 overflow-y-auto custom-scrollbar pr-2">
                                            {news.map((article, idx) => (
                                                <div key={idx} class="bg-slate-800 p-3 rounded-lg border border-slate-700/30 hover:border-purple-500/30 transition-colors">
                                                    <div class="flex items-start justify-between gap-2">
                                                        <div class="flex-1">
                                                            <a href={article.url} target="_blank" rel="noopener noreferrer" class="text-white hover:text-purple-400 transition-colors font-medium text-sm">
                                                                {article.title}
                                                            </a>
                                                            <div class="flex items-center gap-2 mt-1 text-xs text-slate-400">
                                                                <span>{article.source}</span>
                                                                {article.sentiment && (
                                                                    <span class={`px-1.5 py-0.5 rounded ${article.sentiment === 'positive' ? 'bg-green-500/20 text-green-400' : article.sentiment === 'negative' ? 'bg-red-500/20 text-red-400' : 'bg-slate-700 text-slate-400'}`}>
                                                                        {article.sentiment}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Technical Indicators Grid */}
                                <div>
                                    <h3 class="flex items-center gap-2 text-lg font-semibold text-white mb-4">
                                        <Icon name="cpu" className="w-5 h-5 text-blue-400" />
                                        Technical Indicators
                                    </h3>
                                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 h-64 overflow-y-auto custom-scrollbar pr-2">
                                        {Object.entries(item.indicators)
                                            .filter(([key]) => !key.startsWith('BBL') && !key.startsWith('BBM') && !key.startsWith('BBU'))
                                            .map(([key, val], idx) => (
                                                <div key={idx} class="bg-slate-800 p-3 rounded-lg border border-slate-700/30 hover:border-blue-500/30 transition-colors">
                                                    <div class="text-xs text-slate-500 uppercase truncate" title={key}>{key.split('_')[0]}</div>
                                                    <div class="text-slate-200 font-mono mt-1">
                                                        {typeof val === 'number' ? val.toFixed(4) : val}
                                                    </div>
                                                </div>
                                            ))
                                        }
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [selectedItem, setSelectedItem] = useState(null);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const response = await fetch('/api/scan');
                    const json = await response.json();
                    setData(json.data);
                } catch (error) {
                    console.error("Failed to fetch data:", error);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            return (
                <div>
                    <Header onRefresh={fetchData} loading={loading} />
                    
                    {/* Only show selector and stats if we have data */}
                    {data.length > 0 && (
                        <>
                             <CoinSelector data={data} onSelect={setSelectedItem} />
                             <Stats data={data} />
                        </>
                    )}
                    
                    <div class="glass rounded-xl overflow-hidden shadow-2xl">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-800/50 text-slate-300 border-b border-slate-700">
                                        <th class="p-4 font-semibold">Asset</th>
                                        <th class="p-4 font-semibold">Price (USDT)</th>
                                        <th class="p-4 font-semibold">Signal</th>
                                        <th class="p-4 font-semibold">Score</th>
                                        <th class="p-4 font-semibold">RSI (14)</th>
                                        <th class="p-4 font-semibold">Trend</th>
                                        <th class="p-4 font-semibold">Key Indicators</th>
                                        <th class="p-4 font-semibold">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {loading && data.length === 0 ? (
                                        <tr>
                                            <td colSpan="8" class="p-8 text-center text-slate-500">
                                                <div class="flex flex-col items-center gap-2">
                                                    <Icon name="loader-2" className="w-8 h-8 animate-spin text-blue-500" />
                                                    Loading market data...
                                                </div>
                                            </td>
                                        </tr>
                                    ) : (
                                        data.map((item) => (
                                            <TableRow 
                                                key={item.symbol} 
                                                item={item} 
                                                openModal={setSelectedItem} 
                                            />
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {selectedItem && (
                        <Modal item={selectedItem} onClose={() => setSelectedItem(null)} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
